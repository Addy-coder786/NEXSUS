# Rendered by the nginx image's envsubst step (only ${API_UPSTREAM} is substituted).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  client_max_body_size 30m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # REST API, including the assistant's Server-Sent Events stream.
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # SSE: the API also sends X-Accel-Buffering: no; long reads for long assistant turns.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location /socket.io/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location /uploads/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
  }

  # Fingerprinted build assets can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: client-side routes resolve to index.html, which is never cached.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
